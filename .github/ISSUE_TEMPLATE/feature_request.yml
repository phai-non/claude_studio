name: ✨ Feature Request / 기능 제안
description: 새 기능 또는 기존 기능 개선 제안. / Suggest a new feature or improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 제안 전 확인 / Before suggesting

        README의 **로드맵(v1.1+ / v1.2+)** 섹션에 이미 계획된 항목인지 먼저 확인해주세요.
        Please check the **Roadmap (v1.1+ / v1.2+)** in README first to avoid duplicates.

  - type: checkboxes
    id: prechecks
    attributes:
      label: 사전 확인 / Pre-flight checks
      options:
        - label: 기존 이슈를 검색해 중복이 없는지 확인했습니다. / I searched existing issues.
          required: true
        - label: README 로드맵을 확인했습니다. / I checked the README roadmap.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제 / Problem
      description: '"무엇을" 보다 "왜"를 먼저 설명해주세요. / Explain the "why" before the "what".'
      placeholder: "예: 같은 agent 5개를 다른 프로젝트에 복사하려면 매번 수동 import해야 합니다."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안 / Proposed solution
      placeholder: "예: Marketplace 외에 '내 라이브러리' 개념을 추가해 로컬 즐겨찾기를 관리한다."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안 / Alternatives considered
      description: 검토했지만 채택하지 않은 다른 접근이 있다면. / Other approaches you considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 추가 컨텍스트 / Additional context
      description: 스크린샷, 참고 링크, 모킹 등. / Screenshots, links, mocks, etc.
    validations:
      required: false
